name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      # The tests run the real face models. Cached by their checksum list; the
      # fetch script re-verifies a cached copy and downloads again if it is wrong.
      - uses: actions/cache@v4
        with:
          path: models
          key: face-models-${{ hashFiles('src/server/faces/models.sha256') }}
      - run: pixi run models
      - run: pixi run typecheck
      - run: pixi run test
