services:
  viewer:
    build: .
    # Host port first: change 8080 to fit alongside other services on the server.
    # Reachable only from the home network and VPN; v1 has no login (ADR-0001).
    ports:
      - "8080:3000"
    # faces.db: face embeddings, boxes, Photo hashes and Person names, and nothing
    # else (ADR-0002). Keep this volume out of any backup that leaves the server.
    volumes:
      - face-data:/app/data
    restart: unless-stopped

volumes:
  face-data:
