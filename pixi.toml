[workspace]
authors = ["Bryon Hance <bryon.hance@gmail.com>"]
channels = ["conda-forge"]
name = "family_photos"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
install = "pnpm install --frozen-lockfile"
dev = { cmd = "pnpm run dev", depends-on = ["install"] }
test = { cmd = "pnpm run test", depends-on = ["install"] }
typecheck = { cmd = "pnpm run typecheck", depends-on = ["install"] }
build = { cmd = "pnpm run build", depends-on = ["install"] }
# The face models, then the pet models (versioned separately, in models/pets/).
models = "bash scripts/fetch-models.sh && bash scripts/fetch-pet-models.sh"
similarity = { cmd = "pnpm exec tsx scripts/face-similarity.ts", depends-on = ["install"] }
pet-models = "bash scripts/pet-trial/fetch-models.sh"
pet-trial = { cmd = "pnpm exec tsx scripts/pet-trial/similarity.ts", depends-on = ["install"] }

[dependencies]
pnpm = ">=12.4.1,<13"
typescript = ">=6.0.2,<7"
nodejs = ">=26.12.1,<26.13"

# The pet trial run (scripts/pet-trial/): a separate environment, so PyTorch
# never enters the app's. Used once to export the Avito CLIP-L vision tower to ONNX.
[feature.pet-export.dependencies]
python = "3.12.*"
pytorch-cpu = "*"
transformers = "*"
onnx = "*"
safetensors = "*"
onnxruntime = "*"

[feature.pet-export.tasks]
pet-export = "python scripts/pet-trial/export-avito.py"

[environments]
pet-export = { features = ["pet-export"], no-default-feature = true }
